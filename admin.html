<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | Prime Roleplay</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="forum.css">
<style>
.admin-wrap{max-width:1180px;margin:0 auto;padding:50px 22px 90px}.admin-hero{padding:70px 0 35px}.admin-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:22px}.admin-card{background:rgba(11,18,32,.9);border:1px solid rgba(53,167,255,.18);border-radius:18px;padding:24px;box-shadow:0 15px 50px rgba(0,0,0,.25)}.admin-card h2{margin:0 0 18px}.admin-field{margin-bottom:14px}.admin-field label{display:block;margin-bottom:7px;font-weight:700}.admin-field input,.admin-field select,.admin-field textarea{width:100%;box-sizing:border-box;background:#060c16;color:#fff;border:1px solid #22334c;border-radius:10px;padding:12px;font:inherit}.admin-field textarea{min-height:90px;resize:vertical}.admin-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.admin-actions button{border:0;border-radius:9px;padding:11px 8px;font-weight:800;cursor:pointer;background:#1677ff;color:#fff}.admin-actions .danger{background:#b8324b}.admin-actions .warn{background:#b97818}.admin-result{margin-top:14px;min-height:22px;color:#8fd4ff}.user-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}.user-row:last-child{border-bottom:0}.user-name{font-weight:800}.user-meta{font-size:.85rem;color:var(--muted);margin-top:4px}.status-pill{font-size:.72rem;border:1px solid #29415e;border-radius:999px;padding:5px 8px;white-space:nowrap}.admin-note{color:var(--muted);font-size:.9rem;line-height:1.6}.hidden{display:none}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.admin-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="site-header"><nav class="navbar"><a class="brand" href="index.html">PRIME <span>ROLEPLAY</span></a><div class="nav-links"><a href="forum.html">Forum</a><a href="applications.html">Applications</a><a href="profile.html">Profile</a></div></nav></header>
<main class="admin-wrap">
<section class="admin-hero"><p class="eyebrow">STAFF CONTROL CENTER</p><h1>Admin Panel</h1><p class="admin-note">Moderate Prime Roleplay EN1 members. Ban, kick, timeout and lock accounts from one place.</p></section>
<div id="denied" class="admin-card hidden"><h2>Access denied</h2><p class="admin-note">This panel is restricted to Prime Roleplay staff.</p></div>
<section id="panel" class="admin-grid hidden">
<div class="admin-card"><h2>Moderate player</h2><div class="admin-field"><label for="userSearch">Search player</label><input id="userSearch" placeholder="Username or display name"></div><div id="userList"></div><div class="admin-field"><label for="reason">Reason</label><textarea id="reason" placeholder="Reason for moderation..."></textarea></div><div class="admin-field"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="1" placeholder="Leave blank for permanent / kick / lock"></div><div class="admin-actions"><button data-action="ban" class="danger">Ban</button><button data-action="kick">Kick</button><button data-action="timeout" class="warn">Timeout</button><button data-action="lock" class="danger">Lock</button><button data-action="unban">Unban</button><button data-action="unlock">Unlock</button></div><div id="result" class="admin-result"></div></div>
<div class="admin-card"><h2>Recent moderation</h2><div id="actions"><p class="admin-note">Loading...</p></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script>
<script>
(()=>{const sb=window.primeSupabase,$=id=>document.getElementById(id);let selected=null;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){if(!sb){$('denied').classList.remove('hidden');$('denied').querySelector('p').textContent='Supabase is not configured.';return}const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html?redirect=admin.html';return}const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).single();if(!p||!['admin','moderator'].includes(p.role)){$('denied').classList.remove('hidden');return}$('panel').classList.remove('hidden');loadUsers();loadActions()}
async function loadUsers(){const q=$('userSearch').value.trim();let query=sb.from('profiles').select('id,username,display_name,role,banned_until,timeout_until,locked').order('created_at',{ascending:false}).limit(30);if(q)query=query.or(`username.ilike.%${q}%,display_name.ilike.%${q}%`);const {data,error}=await query;if(error){$('userList').innerHTML='<p class="admin-note">'+esc(error.message)+'</p>';return}$('userList').innerHTML=(data||[]).map(u=>`<div class="user-row"><div><div class="user-name">${esc(u.username||u.display_name||'Player')}</div><div class="user-meta">${esc(u.display_name||'')} · ${esc(u.role)}</div></div><button class="status-pill" data-user="${u.id}">${u.id===selected?'Selected':'Select'}</button></div>`).join('')||'<p class="admin-note">No players found.</p>';$('userList').querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{selected=b.dataset.user;loadUsers()})}
async function loadActions(){const {data,error}=await sb.from('moderation_actions').select('action,reason,created_at,expires_at,profiles!moderation_actions_target_user_id_fkey(username)').order('created_at',{ascending:false}).limit(25);if(error){$('actions').innerHTML='<p class="admin-note">'+esc(error.message)+'</p>';return}$('actions').innerHTML=(data||[]).map(a=>`<div class="user-row"><div><div class="user-name">${esc(a.action.toUpperCase())} · ${esc(a.profiles?.username||'Player')}</div><div class="user-meta">${esc(a.reason||'No reason')} · ${new Date(a.created_at).toLocaleString()}</div></div><span class="status-pill">${a.expires_at?'Timed':'Recorded'}</span></div>`).join('')||'<p class="admin-note">No moderation actions yet.</p>'}
$('userSearch').addEventListener('input',loadUsers);document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=async()=>{if(!selected){$('result').textContent='Select a player first.';return}const action=btn.dataset.action,reason=$('reason').value.trim()||null,duration=$('duration').value?Number($('duration').value):null;$('result').textContent='Applying...';const {data,error}=await sb.rpc('moderate_user',{p_target:selected,p_action:action,p_reason:reason,p_duration_minutes:duration});if(error){$('result').textContent=error.message;return}$('result').textContent=`${action} applied successfully.`;loadUsers();loadActions()});init();})();
</script></body></html>
